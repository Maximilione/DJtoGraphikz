<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DJtoGraphikz Output</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
    /* letterbox: the engine sizes the canvas to the output aspect ratio,
       the body centers it — a resized window shows bars, never distortion */
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="output-canvas"></canvas>
  <script type="module" src="./output-main.ts"></script>
</body>
</html>
